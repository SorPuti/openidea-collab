id = "sorputi.openidea-collab"
name = "OpenIDEA Collab"
version = "0.2.0"
description = "Experimental real-time collaborative editor for OpenIDEA."
authors = ["OpenIDEA Collab contributors"]
license = "MIT"
change-notes = "Experimental collaborative editor for .collabtest files."
categories = ["tools"]
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = []

[capabilities]
required = []
optional = ["process:openidea-collab-helper"]

[[contributes.customEditors]]
id = "collab-experimental"
title = "Collaborative Editor (experimental)"
patterns = ["*.collabtest"]
priority = "default"
web = "web/collab-editor/index.html"
