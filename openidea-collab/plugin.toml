id = "sorputi.openidea-collab"
name = "OpenIDEA Collab"
version = "0.2.0"
description = "Real-time collaboration for OpenIDEA: sync files between developers."
authors = ["OpenIDEA Collab contributors"]
license = "MIT"
change-notes = "0.2.0 — cursor decorations, GitHub avatars, file badges, status bar, remote server support."
categories = ["tools"]
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-saved", "on-event:editor-focused", "on-command:*", "on-schedule:60"]

[capabilities]
required = ["project.read", "project.write", "events", "storage", "editor.read"]

[[contributes.commands]]
id = "create-room"
title = "Collab: Create Room"
category = "Collab"

[[contributes.commands]]
id = "join-room"
title = "Collab: Join Room"
category = "Collab"

[[contributes.commands]]
id = "leave-room"
title = "Collab: Leave Room"
category = "Collab"

[[contributes.commands]]
id = "set-server"
title = "Collab: Set Server URL"
category = "Collab"

[[contributes.views]]
id = "collab-panel"
title = "Collaborators"
icon = "users"
location = "right"
