[package]
name = "collab-e2e-sdk-proof"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dev-dependencies]
openidea_collab = { package = "openidea-plugin-openidea-collab", path = "../../../openidea-collab" }
collab-server = { path = "../../../collab-server" }
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.40" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"
