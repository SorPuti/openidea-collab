[package]
name = "openidea-collab-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
openidea-collab-core = { path = "../collab-core" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
ignore = "0.4"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
collab-server = { path = "../collab-server" }
axum = "0.8"
