name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  # ── collab-server binaries ──────────────────────────────────────────────────
  server:
    name: server ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   name: linux-x86_64  }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  name: linux-aarch64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,        name: macos-x86_64  }
          - { os: macos-latest,   target: aarch64-apple-darwin,       name: macos-aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (Linux ARM only)
        if: matrix.name == 'linux-aarch64'
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.name }}" = "linux-aarch64" ]; then
            cross build --release --manifest-path collab-server/Cargo.toml --target ${{ matrix.target }}
          else
            cargo build --release --manifest-path collab-server/Cargo.toml --target ${{ matrix.target }}
          fi
      - name: Stage
        run: cp collab-server/target/${{ matrix.target }}/release/collab-server collab-server-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: collab-server-${{ matrix.name }}
          path: collab-server-${{ matrix.name }}

  # ── plugin WASM bundle ───────────────────────────────────────────────────────
  plugin:
    name: plugin wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build WASM
        run: cargo build --release --manifest-path openidea-collab/Cargo.toml --target wasm32-wasip2
      - name: Package bundle
        run: |
          mkdir -p bundle/dist
          cp openidea-collab/plugin.toml bundle/
          cp openidea-collab/target/wasm32-wasip2/release/openidea_collab.wasm bundle/dist/plugin.wasm
          tar -czf plugin.tar.gz -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin.tar.gz

  # ── rolling "latest" release ─────────────────────────────────────────────────
  release:
    needs: [server, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: true
          files: |
            collab-server-linux-x86_64/collab-server-linux-x86_64
            collab-server-linux-aarch64/collab-server-linux-aarch64
            collab-server-macos-x86_64/collab-server-macos-x86_64
            collab-server-macos-aarch64/collab-server-macos-aarch64
            plugin/plugin.tar.gz
