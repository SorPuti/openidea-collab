name: Verify and build experimental artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test collaboration core
        run: cargo test --locked --manifest-path collab-core/Cargo.toml
      - name: Test server
        run: cargo test --locked --manifest-path collab-server/Cargo.toml
      - name: Test helper
        run: cargo test --locked --manifest-path collab-helper/Cargo.toml
      - name: Test plugin
        run: cargo test --locked --manifest-path openidea-collab/Cargo.toml
      - name: Test installer validation
        run: bash tests/installer_test.sh

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install matching OpenIDEA plugin CLI
        run: cargo install --locked --git https://github.com/l0ng-ai/openidea --tag v0.1.40 ide-host --bin openidea-plugin
      - name: Build and validate experimental plugin bundle
        run: |
          openidea-plugin build openidea-collab
          bash scripts/package-experimental.sh artifacts/plugin-experimental.tar.gz
          python3 tests/package_test.py
          python3 tests/switch_dev_link_test.py
      - name: Build Linux server and helper
        run: |
          cargo build --release --locked --manifest-path collab-server/Cargo.toml
          cargo build --release --locked --manifest-path collab-helper/Cargo.toml
          cp collab-server/target/release/collab-server artifacts/
          cp collab-helper/target/release/openidea-collab-helper artifacts/
          bash scripts/package-client.sh artifacts/openidea-collab-client-linux-x86_64.tar.gz
          python3 tests/client_bundle_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-linux-x86_64
          path: artifacts/
          if-no-files-found: error
