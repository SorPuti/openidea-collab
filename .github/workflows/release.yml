name: Prepare release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain
      - name: Verify tag and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 src/tooling/verify-release.py --tag "$RELEASE_TAG"
      - run: ./src/tooling/check.sh

  server:
    needs: validate
    if: vars.COLLAB_RELEASE_READY == 'true'
    name: server ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: macos-15, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: macos-15, target: aarch64-apple-darwin, name: macos-aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain and target
        run: rustup target add ${{ matrix.target }}
      - name: Install cross for Linux ARM
        if: matrix.name == 'linux-aarch64'
        run: cargo install cross --version 0.2.5 --locked
      - name: Build server
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_NAME: ${{ matrix.name }}
        run: |
          if [ "$BUILD_NAME" = linux-aarch64 ]; then
            cross build --locked --release -p collab-server --target "$BUILD_TARGET"
          else
            cargo build --locked --release -p collab-server --target "$BUILD_TARGET"
          fi
          cp "target/$BUILD_TARGET/release/collab-server" "collab-server-$BUILD_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: collab-server-${{ matrix.name }}
          path: collab-server-${{ matrix.name }}

  # Enable only after the security/reliability review and manual IDE validation.
  package:
    needs: [validate, server]
    if: vars.COLLAB_RELEASE_READY == 'true'
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain
      - name: Install CLI matching the SDK
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 install --locked --git https://github.com/l0ng-ai/openidea --tag v0.1.40 ide-host --bin openidea-plugin
      - name: Build and sign exact tag
        env:
          OPENIDEA_KEY: ${{ secrets.OPENIDEA_KEY }}
          OPENIDEA_PUBLISHER: sorputi
          RELEASE_TAG: ${{ github.ref_name }}
          OPENIDEA_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          umask 077
          key_file="$RUNNER_TEMP/openidea-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$OPENIDEA_KEY" > "$key_file"
          unset OPENIDEA_KEY
          export OPENIDEA_KEY_FILE="$key_file"
          ./src/tooling/release.sh
      - name: Collect server binaries
        uses: actions/download-artifact@v4
        with:
          pattern: collab-server-*
          merge-multiple: true
          path: dist-release/${{ github.ref_name }}/
      - name: Checksum all release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 src/tooling/checksums.py "dist-release/$RELEASE_TAG"
      - name: Upload reviewable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-plugin
          path: dist-release/${{ github.ref_name }}/
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist-release/"$RELEASE_TAG"/* \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes 'Candidate for review. Publication and marketplace submission require completed security remediation and IDE validation.'
