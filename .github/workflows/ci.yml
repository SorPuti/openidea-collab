name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Standard hosted compute is free for public repositories; never select a larger runner here.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify source metadata
        run: python3 src/tooling/verify-release.py
      - name: Check shell scripts
        run: bash -n src/tooling/check.sh src/tooling/release.sh
      - name: Format, lint, test and build WASM
        run: ./src/tooling/check.sh
