[package]
name = "openidea-plugin-openidea-collab"
version = "0.4.0"
edition = "2024"
license = "MIT"
publish = false

# Built by the repository workspace; distribution contains a single WASM component.

[lib]
name = "openidea_collab"
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/SorPuti/openidea", rev = "e48d0b1fc31f0c7d1f214fb6f1e04e8197ba6f48" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openidea-collab-protocol = { path = "../protocol" }
openidea-collab-core = { path = "../core" }
uuid = { version = "1", features = ["serde", "v5"] }
