id = "sorputi.openidea-collab"
name = "OpenIDEA Collab"
version = "0.4.5"
description = "Realtime collaboration for explicitly shared OpenIDEA documents through collab.synthosia.com."
authors = ["OpenIDEA Collab contributors"]
license = "MIT"
change-notes = "Redesigns the Collaboration panel with functional onboarding, session, documents, activity and settings sections. Remote document application remains disabled pending host no-follow guarantees."
categories = ["tools"]
icon = "icons/collab.svg"
engines.openidea = "^1.6"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-view:collab-panel", "on-event:websocket-ready", "on-event:document-changed"]

[capabilities]
required = ["project.read", "editor.read", "events", "storage", "secrets", "net:collab.synthosia.com"]

[contributes.settings]
title = "OpenIDEA Collab"
schema = "settings.schema.json"

[[contributes.secrets]]
name = "member-credential"
label = "Collaboration member credential"
description = "Stored automatically for one explicitly prepared project/session; never saved in project files."

[[contributes.secrets]]
name = "relay-admission"
label = "Relay admission token"
description = "Optional operator-issued token used only to create a session. Stored in the IDE keychain, never in project files."

[[contributes.commands]]
id = "create-session"
title = "Collab: Prepare Session"
category = "Collab"

[[contributes.commands]]
id = "join-session"
title = "Collab: Accept Invitation"
category = "Collab"

[[contributes.commands]]
id = "create-invite"
title = "Collab: Create Invitation"
category = "Collab"

[[contributes.commands]]
id = "leave-session"
title = "Collab: Leave Session"
category = "Collab"

[[contributes.commands]]
id = "connect-realtime"
title = "Collab: Connect Realtime"
category = "Collab"

[[contributes.commands]]
id = "disconnect-realtime"
title = "Collab: Disconnect Realtime"
category = "Collab"

[[contributes.commands]]
id = "share-current-document"
title = "Collab: Share Current Document"
category = "Collab"

[[contributes.commands]]
id = "share-open-documents"
title = "Collab: Share All Open Documents"
category = "Collab"

[[contributes.commands]]
id = "stop-sharing-current-document"
title = "Collab: Stop Sharing Current Document"
category = "Collab"

[[contributes.views]]
id = "collab-panel"
title = "Collaboration"
icon = "icons/collab.svg"
location = "right"
